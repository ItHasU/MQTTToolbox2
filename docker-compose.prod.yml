# Self-hosted deployment stack: the published image (ghcr.io) + its own
# Postgres. Distinct from docker-compose.yml (that one is dev-only: base +
# a throwaway Mosquitto for `npm run db:up`), and never picked up by that
# file's `db:up`/`db:down` npm scripts — always pass -f explicitly:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# See .env.prod.example for the variables this file reads, and DEPLOY.md
# for the full walkthrough (pulling a private ghcr.io image, first login,
# configuring the broker — that one's a system setting edited from the
# Paramètres screen after first boot, not an environment variable: only
# PORT/BASE_URL/DB_URL/SECRET_KEY are bootstrap, see .env.prod.example).

services:

  app:
    image: ghcr.io/ithasu/mqtttoolbox2:${MQTT_IMAGE_TAG:-spec-reboot}
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-3000}:3000"
    environment:
      PORT: 3000
      BASE_URL: ${MQTT_BASE_URL:?set MQTT_BASE_URL in .env.prod}
      DB_URL: postgresql://${MQTT_DB_USER:-mqtt}:${MQTT_DB_PASSWORD:-mqtt}@postgres:5432/${MQTT_DB_NAME:-mqtt}
      SECRET_KEY: ${MQTT_SECRET_KEY:?set MQTT_SECRET_KEY in .env.prod — see the generation command in .env.prod.example}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MQTT_DB_USER:-mqtt}
      POSTGRES_PASSWORD: ${MQTT_DB_PASSWORD:-mqtt}
      POSTGRES_DB: ${MQTT_DB_NAME:-mqtt}
    # Not exposed to the host on purpose — only `app`, on the compose
    # network, needs to reach it. Use `docker compose exec postgres psql
    # ...` for a one-off manual query instead of opening the port.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MQTT_DB_USER:-mqtt} -d ${MQTT_DB_NAME:-mqtt}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional — remove this service (and point mqtt.url at your own broker
  # from the Paramètres screen after first login) if you already have one
  # your devices connect to. Kept here so the stack is runnable as-is.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]

volumes:
  postgres-data:
